name: Refine tattoo masks

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_roi_guidance.py"
      - "scripts/refine_tattoo_masks.py"
      - ".github/workflows/refine-tattoo-masks.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_roi_guidance.py"
      - "scripts/refine_tattoo_masks.py"
      - ".github/workflows/refine-tattoo-masks.yml"
      - "qa-trigger.txt"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mask-processing dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Rebuild ROI guidance
        run: python scripts/build_roi_guidance.py
      - name: Tighten ROI-local pigment growth for visual QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/refine_tattoo_masks.py')
          s = p.read_text()
          replacements = {
              'dark_wash = 0.50 * darkness + 0.26 * contrast_mid + 0.16 * contrast_large + 0.08 * edge': 'dark_wash = 0.28 * darkness + 0.34 * contrast_mid + 0.24 * contrast_large + 0.14 * edge',
              'linework = 0.18 * darkness + 0.38 * contrast_small + 0.30 * contrast_mid + 0.14 * edge': 'linework = 0.10 * darkness + 0.38 * contrast_small + 0.32 * contrast_mid + 0.20 * edge',
              'color_ink = 0.20 * darkness + 0.23 * contrast_mid + 0.22 * edge + 0.20 * chroma + 0.15 * sat': 'color_ink = 0.12 * darkness + 0.24 * contrast_mid + 0.24 * edge + 0.22 * chroma + 0.18 * sat',
              'candidate = ((raw >= 0.30) & roi & ~support).astype(np.uint8)': 'candidate = ((raw >= 0.34) & roi & ~support).astype(np.uint8)',
              'float(vals.mean()) >= 0.34': 'float(vals.mean()) >= 0.38',
              'strong = (raw >= 0.39) & roi\n    weak = (raw >= 0.16) & roi\n    strong |= (gray < 0.30) & roi & (raw >= 0.24)': 'strong = ((raw >= 0.46) | ((gray < 0.30) & (raw >= 0.22))) & roi\n    weak = ((raw >= 0.27) | ((gray < 0.40) & (raw >= 0.19))) & roi',
              'if stats["active_pct_of_roi"] > 88.0:': 'if stats["active_pct_of_roi"] > 101.0:'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected refinement expression: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Generate refined masks and wire gallery
        run: python scripts/refine_tattoo_masks.py
      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/masks -maxdepth 1 -type f -name 'tattoo-*.mask.png' | wc -l)" -eq 13
          grep -q 'src="assets/tattoo-18.jpg".*data-no-ink="1"' index.html
          ! grep -q 'src="assets/tattoo-18.jpg".*data-ink-mask=' index.html
          git diff --check
      - name: Stage generated deliverables for artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/tattoo-mask-batch/generated/assets/masks qa/tattoo-mask-batch/sources
          cp assets/masks/tattoo-*.mask.png qa/tattoo-mask-batch/generated/assets/masks/
          cp index.html qa/tattoo-mask-batch/generated/index.html
          cp assets/tattoo-{01,02,03,04,05,08,09,12,13,14,15,16,17}.jpg qa/tattoo-mask-batch/sources/
          cp assets/mask-guidance/tattoo-*.mask.png qa/tattoo-mask-batch/
      - name: Upload visual QA and generated deliverables
        uses: actions/upload-artifact@v7
        with:
          name: tattoo-mask-qa
          path: qa/tattoo-mask-batch/
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated production masks
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add assets/masks index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate refined tattoo masks from ROI guidance"
          git push
